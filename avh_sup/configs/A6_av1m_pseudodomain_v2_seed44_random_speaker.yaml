# ============================================================
#  A6-AV1M-PseudoDomain-v2 (seed 44) — RANDOM-SPEAKER ABLATION
#
#  Reviewer follow-up: domain label sensitivity, intermediate condition.
#
#      speaker_hash (headline):  d = hash(speaker_id) % 2
#                                → speaker-grouped + meaningful partition
#      random_speaker (this row): d = hash("random_speaker:<seed>:<speaker_id>") % 2
#                                → speaker-grouped + random label (no semantic
#                                   structure, but speaker consistency preserved)
#      random_clip:              d = hash("random_clip:<seed>:<path>") % 2
#                                → no speaker-grouping (per-clip random)
#
#  This row isolates whether "speaker-grouped" matters even when the label
#  is otherwise random. If speaker_hash works because of speaker grouping
#  (not because of any semantic content), random_speaker should match.
# ============================================================

ablation_id: "A6_av1m_pseudodomain_v2_random_speaker"

data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: true
  domain_label_mode: "random_speaker"
  domain_label_seed: 44

model_hparams:
  feat_dim: 1024
  syn_dim: 256
  spec_dim: 256
  sda_dim: 128
  mi_dim: 128

  lambda_mi: 1.0
  lambda_sda: 0.5
  lambda_dis: 1.0
  lambda_orth: 0.1
  lambda_dadv: 1.0
  lambda_ddis: 1.0
  grl_alpha: 1.0

  sda_eps: 0.05
  sda_n_iter: 5
  lr: 1.0e-3

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A6_av1m_pseudodomain_v2_random_speaker_seed44/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A6_av1m_pseudodomain_v2_random_speaker_seed44/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 20
seed: 44

early_stopping:
  metric: "val_auc_causal"
  mode: "max"
  patience: 20

favc_eval_info:
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/favc_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/favc_7030_canonical"
  split: "test"
  apply_l2: true
  check_every_n_epochs: 1
