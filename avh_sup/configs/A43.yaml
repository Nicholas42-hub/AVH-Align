# ============================================================
#  A43 — Z_c/Z_s Causal + Stronger Domain Adversarial (Frozen Encoder)
#
#  Same architecture as A42, with stronger domain disentanglement:
#    lambda_dadv:      1.0 → 5.0
#    grl_domain_alpha: 1.0 → 3.0
#    lambda_ddis:      1.0 → 2.0
#  epochs: 10 (convergence by epoch 5 in A42)
#
#  Losses:
#    L_task   — CE(causal_head(Z_c))               [AV1M only]
#    L_adv    — CE(adv_head(GRL(Z_s)), label)       [AV1M only]
#    L_dadv   — BCE(domain_head_c(GRL(Z_c_pool)))   [all clips]
#    L_ddis   — BCE(domain_head_s(Z_s_pool))        [all clips]
#    L_orth   — cos²(Z_c, Z_s)                      [AV1M only]
# ============================================================

ablation_id: "A43"

data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: true

favc_domain_info:
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/favc_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/favc"
  split: "val"
  real_only: true
  apply_l2: true

favc_oversample: 14

model_hparams:
  feat_dim:  1024
  proj_dim:  512

  # ── Label adversarial on Z_s (A2) ────────────────────────────────────────
  lambda_adv:    10.0
  grl_alpha:      5.0

  # ── Domain adversarial on Z_c — STRONGER ─────────────────────────────────
  lambda_dadv:    5.0
  grl_domain_alpha: 3.0

  # ── Domain discriminative on Z_s — STRONGER ──────────────────────────────
  lambda_ddis:    2.0

  # ── Orthogonality ─────────────────────────────────────────────────────────
  lambda_orth:    0.1

  lr: 1.0e-3

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A43/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A43/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 10
seed: 43

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 10

output_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A43/results"
