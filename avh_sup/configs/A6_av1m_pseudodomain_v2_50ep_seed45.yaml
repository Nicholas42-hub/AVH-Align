# ============================================================
#  A6-AV1M-PseudoDomain-v2 50-epoch retrain — seed 45
#
#  Source-val ckpt selection ONLY. No FAVC monitoring during
#  training (favc_eval_info intentionally absent). Compliant with
#  paper-stated protocol: ckpt by AV1M val_auc_causal max.
# ============================================================

ablation_id: "A6_av1m_pseudodomain_v2"

data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: true

model_hparams:
  feat_dim: 1024
  syn_dim: 256
  spec_dim: 256
  sda_dim: 128
  mi_dim: 128

  lambda_mi: 1.0
  lambda_sda: 0.5
  lambda_dis: 1.0
  lambda_orth: 0.1
  lambda_dadv: 1.0
  lambda_ddis: 1.0
  grl_alpha: 1.0

  sda_eps: 0.05
  sda_n_iter: 5
  lr: 1.0e-3

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A6_av1m_pseudodomain_v2_50ep_seed45/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A6_av1m_pseudodomain_v2_50ep_seed45/ckpts"
    metric: "val_loss_partial"
    mode: "min"

epochs: 50
seed: 45

early_stopping:
  metric: "val_loss_partial"
  mode: "min"
  patience: 50
