# ============================================================
#  Modal Balance B_all — All Three Constraints Combined
# ============================================================
#
#  Base: A2 (adversarial + stop-gradient on Z_s)
#
#  All three modal balance constraints enabled simultaneously:
#
#  方向1 (use_modal_cls):
#    Per-modality classification losses directly supervise v_c and a_c.
#
#  方向2 (use_cross_modal):
#    Cross-modal cosine alignment pulls v_c and a_c toward the same semantic space.
#
#  方向3 (use_modal_disc):
#    Modal discriminator adversarial on causal tokens forces modality-agnostic
#    representations via GRL.
#
#  Note on 方向2 + 方向3 interaction:
#    方向2 encourages alignment (same direction) and 方向3 independently
#    encourages indistinguishability (same distribution), which is complementary:
#    alignment pulls their mean together; adversarial flattens the distribution.
#
# ============================================================

modal_balance_id: "B_all"
modal_balance:
  use_modal_cls:   true   # 方向1 ✓
  use_cross_modal: true   # 方向2 ✓
  use_modal_disc:  true   # 方向3 ✓

data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: true

model_hparams:
  feat_dim:  1024
  proj_dim:  512

  # A2 base losses
  lambda_orth:     0.5
  lambda_adv:     10.0
  grl_alpha:       5.0

  # 方向1
  lambda_modal_cls: 1.0

  # 方向2
  lambda_cross_modal: 0.5

  # 方向3
  lambda_modal_disc: 1.0
  grl_modal_alpha:   1.0

  lr: 1.0e-3

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_B_all/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_B_all/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 100
seed: 43

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 20

output_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_B_all/results"
