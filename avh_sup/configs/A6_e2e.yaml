# ============================================================
#  A6_e2e — FCD + Domain Adversarial Push-Pull, Full E2E
#
#  A6 architecture:
#    Z_c (causal) = [synergistic, unique_v, synergistic_a, unique_a]
#    Z_s (spurious) = [redundant_v, redundant_a]
#
#  Domain adversarial:
#    L_dadv: GRL(Z_c) → domain classifier  (expel domain from Z_c)
#    L_ddis: Z_s → domain classifier       (concentrate domain in Z_s)
#
#  Key differences from A6 frozen-encoder:
#    1. AV-HuBERT fully unfrozen (n_unfreeze_layers = -1)
#    2. Training data: ALL available preprocessed AV1M clips (~63k)
#    3. Smaller LRs, mixed precision, gradient accumulation
# ============================================================

ablation_id: "A6_e2e"

data_paths:
  # Generated by:  python generate_e2e_csv.py
  e2e_train_csv:  "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/train_e2e_full.csv"
  e2e_val_csv:    "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/val_e2e_full.csv"
  # FAVC real clips used as domain=1 signal (no task label)
  favc_raw_root:  "/scratch/punim2637/nnliang/favc_preprocessed"

model_hparams:
  # AV-HuBERT encoder (fully unfrozen)
  avhubert_ckpt:       "/data/projects/punim2637/nnliang/av_hubert/avhubert/self_large_vox_433h.pt"
  avhubert_root:       "/data/projects/punim2637/nnliang/av_hubert/avhubert"
  n_unfreeze_layers:   -1       # -1 = unfreeze ALL layers

  max_frames:  150              # cap clip length

  # FCD decomposition dimensions (same as frozen A6)
  feat_dim:   1024
  syn_dim:     256
  spec_dim:    256
  sda_dim:     128
  mi_dim:      128

  # Loss weights (same as frozen A6)
  lambda_mi:    1.0
  lambda_sda:   0.5
  lambda_dis:   1.0
  lambda_orth:  0.1
  lambda_dadv:  1.0   # domain adversarial on Z_c
  lambda_ddis:  1.0   # domain discriminative on Z_s
  grl_alpha:    1.0       # max GRL scale for domain adversarial
  dann_progressive: true  # ramp grl_alpha from 0 → max (DANN schedule)
  dann_gamma:   10.0      # DANN schedule steepness

  sda_eps:    0.05
  sda_n_iter: 5

  # Learning rates — encoder gets ~100x smaller LR
  lr_encoder:    1.0e-6
  lr:            1.0e-4
  weight_decay:  1.0e-4

# Training setup
batch_size:              8      # doubled — A100 80GB has headroom
accumulate_grad_batches: 4      # effective batch size = 32 (unchanged)
num_workers:             6
favc_oversample:         10     # repeat FAVC 10× → ~5000 clips vs 60k AV1M
gradient_clip_val:       1.0
precision:               "16-mixed"

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A6_e2e/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A6_e2e/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 30
seed: 43

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 10

output_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A6_e2e/results"
