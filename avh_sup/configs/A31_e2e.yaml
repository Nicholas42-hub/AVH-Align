# A31: L1-d mean alignment — constant gradient, no stalling, task-safe
#
# A30 ROOT CAUSE ANALYSIS:
#   loss_mean_align (d²) = 0.277, loss_ladv = 0.559, loss_task = 0.237
#   Non-task gradient 3.8× task → task AUC collapsed to 0.5 in ep0.
#   d² per-step gradient: 0.217/dim (vs A29 MSE 0.0088/dim = 25× larger)
#
# A31 FIXES:
#   Fix 1 — L1-d loss instead of d² (Cohen's d²):
#     loss = mean(|mu0-mu1| / std_combined.detach())  [mean absolute d per dim]
#     Gradient = ±1/(n_per_class × std_combined) — CONSTANT, NO STALLING.
#     As Δ→0: std_combined→std_within → gradient 5× STRONGER (self-accelerating).
#     Per-dim gradient at λ=0.05: 0.00271/step (31% of A29's safe 0.0088/step).
#
#   Fix 2 — lambda_ladv=0.0 (was 1.0, contributed 0.559 = 45% of non-task):
#     task fraction: 22% (A30) → 72% (A31).
#
#   Fix 3 — gradient_clip_val=2.0 (was 1.0): allows both task and alignment
#     gradients to contribute fully without being clipped away.
#
# Expected dynamics:
#   ep0: task AUC ~1.0 (starts from A9_e2e), z_sync domain AUC ~0.98 (unchanged)
#   ep1+: L1-d constant gradient steadily reduces mean gap while task is protected
#   ep5+: domain AUC hopefully below 0.65, task AUC >0.95

ablation_id: A31_e2e
accumulate_grad_batches: 4
augmentation:
  audio_noise: 0.05
  brightness: 0.5
  enabled: true
  flip_p: 0.5
  p: 0.9
  video_noise: 0.3
batch_size: 8
callbacks:
  ckpt_args:
    ckpt_dir: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A31_e2e/ckpts
    metric: val_auc_causal
    mode: max
  logger:
    log_path: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A31_e2e/logs
    name: csv
data_paths:
  e2e_train_csv: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/train_e2e_full.csv
  e2e_val_csv: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/val_e2e_full.csv
  favc_raw_root: /scratch/punim2637/nnliang/favc_preprocessed
early_stopping:
  metric: val_auc_causal
  mode: max
  patience: 10
epochs: 30
favc_oversample: 3
gradient_clip_val: 2.0          # increased from 1.0: more budget for task gradient
model_hparams:
  app_dim: 256
  avhubert_ckpt: /data/projects/punim2637/nnliang/av_hubert/avhubert/self_large_vox_433h.pt
  avhubert_root: /data/projects/punim2637/nnliang/av_hubert/avhubert
  feat_dim: 1024
  finetune_ckpt: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A9_e2e/ckpts/model-epoch=08-val_auc_causal=1.0000.ckpt
  grl_alpha: 1.0
  grl_alpha_zsync: 1.0
  lambda_ddis: 1.0
  lambda_ladv: 0.0              # KEY: was 1.0 in A30 → contributed 0.559 competing gradient
  lambda_mean_align: 0.05       # KEY: L1-d loss starts ~0.53, contribution ~0.027 (11% of task)
  lambda_orth: 0.1
  lambda_zsync_dann: 0.0
  lr: 0.0001
  lr_encoder: 5.0e-06
  max_frames: 150
  n_unfreeze_layers: -1
  sync_dim: 512
  weight_decay: 0.0001
num_workers: 6
output_path: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A31_e2e/results
precision: 16-mixed
seed: 43
