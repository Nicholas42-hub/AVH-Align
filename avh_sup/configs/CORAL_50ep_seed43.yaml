# ============================================================
#  CORAL-UDA Baseline — 50-epoch retrain, seed 43
# ============================================================

data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: true

favc_domain_info:
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/favc_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/favc"
  split: "val"
  real_only: true
  apply_l2: true

model_hparams:
  feat_dim:      1024
  coral_dim:     256
  lambda_coral:  1.0
  lr:            1.0e-3

batch_size: 16

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_CORAL_50ep_seed43/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_CORAL_50ep_seed43/ckpts"
    metric: "val_auc"
    mode: "max"

epochs: 50
seed: 43

early_stopping:
  metric:   "val_auc"
  mode:     "max"
  patience: 50
