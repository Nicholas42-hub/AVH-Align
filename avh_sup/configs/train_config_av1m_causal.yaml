data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: True

model_hparams:
  feat_dim: 1024         # AV-HuBERT output dimension
  proj_dim: 512          # per-modality causal/spurious projection size
                         # → causal_repr = concat(v_c, a_c) = 1024-d
                         # → spurious_repr = concat(v_s, a_s) = 1024-d

  # Loss weights
  lambda_causal: 1.0     # weight for causal head CE loss
  lambda_spurious: 0.5   # weight for spurious head CE loss
  lambda_orth: 0.1       # weight for orthogonality loss (causal ⊥ spurious)

  lr: 1.0e-3

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_causal/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_causal/ckpts"
    metric: "val_auc_causal"   # optimise for causal AUC — core hypothesis metric
    mode: "max"
  early_stopping:
    metric: "val_auc_causal"
    mode: "max"
    patience: 10

epochs: 100
seed: 43
