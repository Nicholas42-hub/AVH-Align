# A32: Null-space gradient projection + L1-d mean alignment
#
# Previous failures:
#   A29 (MSE λ=500):   stalled — gradient ∝ gap, self-diminishing at ep1→ep2
#   A30 (d²  λ=1.0):   task collapsed ep0 — gradient 25× too large + ladv conflict
#   A31 (L1-d λ=0.05): running — constant gradient, task-safe, but task/align still compete
#
# A32 core idea — null-space projection:
#   d_unit = normalize(mu_FAVC - mu_AV1M)   [computed per-epoch from probe batch]
#   z_sync_for_task = z_sync - (z_sync @ d_unit) * d_unit
#   Task head ONLY sees dims orthogonal to domain direction.
#   Task gradient flows back through this projection → encoder is only rewarded
#   for encoding task info in dims ⊥ d_unit → domain direction becomes useless
#   → encoder abandons d_unit → mean gap collapses naturally.
#
# KEY PROPERTY: task ⊥ alignment gradients by construction. CANNOT conflict.
#
# L1-d mean alignment (λ=0.02) on raw z_sync_pool: active acceleration of
# the gap collapse that projection is already steering toward.

ablation_id: A32_e2e
accumulate_grad_batches: 4
augmentation:
  audio_noise: 0.05
  brightness: 0.5
  enabled: true
  flip_p: 0.5
  p: 0.9
  video_noise: 0.3
batch_size: 8
callbacks:
  ckpt_args:
    ckpt_dir: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A32_e2e/ckpts
    metric: val_auc_causal
    mode: max
  logger:
    log_path: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A32_e2e/logs
    name: csv
data_paths:
  e2e_train_csv: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/train_e2e_full.csv
  e2e_val_csv: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/val_e2e_full.csv
  favc_raw_root: /scratch/punim2637/nnliang/favc_preprocessed
early_stopping:
  metric: val_auc_causal
  mode: max
  patience: 10
epochs: 30
favc_oversample: 3
gradient_clip_val: 2.0
model_hparams:
  app_dim: 256
  avhubert_ckpt: /data/projects/punim2637/nnliang/av_hubert/avhubert/self_large_vox_433h.pt
  avhubert_root: /data/projects/punim2637/nnliang/av_hubert/avhubert
  feat_dim: 1024
  finetune_ckpt: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A9_e2e/ckpts/model-epoch=08-val_auc_causal=1.0000.ckpt
  grl_alpha: 1.0
  grl_alpha_zsync: 1.0
  lambda_ddis: 1.0
  lambda_ladv: 0.0
  lambda_mean_align: 0.02      # L1-d on raw z_sync_pool — accelerates projection's effect
  lambda_orth: 0.1
  lambda_zsync_dann: 0.0
  lr: 0.0001
  lr_encoder: 5.0e-06
  max_frames: 150
  n_unfreeze_layers: -1
  sync_dim: 512
  weight_decay: 0.0001
num_workers: 6
output_path: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A32_e2e/results
precision: 16-mixed
seed: 43
