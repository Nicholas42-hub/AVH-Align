# ============================================================
#  Modal Balance B3 — Modal Discriminator Adversarial (方向3)
# ============================================================
#
#  Base: A2 (adversarial + stop-gradient on Z_s)
#
#  New constraint — 方向3 (use_modal_disc):
#    A modal discriminator is trained to predict whether a token came from
#    v_c (visual causal, label=0) or a_c (audio causal, label=1).
#    A GRL between the projectors and the discriminator reverses the gradient
#    flowing into visual_proj_causal and audio_proj_causal:
#      • Discriminator learns to distinguish modality → normal gradient
#      • Both projectors receive REVERSED gradient → forced to be indistinguishable
#    Result: causal features are modality-agnostic and cannot specialise to audio.
#
#  Hypothesis:
#    Preventing the discriminator from telling v_c from a_c forces both
#    projectors to encode the same type of information.  With stop-gradient
#    additionally on Z_s, the causal branch now carries balanced AV information.
#
# ============================================================

modal_balance_id: "B3"
modal_balance:
  use_modal_cls:   false  # 方向1: per-modality classification ✗
  use_cross_modal: false  # 方向2: cross-modal alignment       ✗
  use_modal_disc:  true   # 方向3: modal discriminator         ✓

data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: true

model_hparams:
  feat_dim:  1024
  proj_dim:  512

  # A2 base losses
  lambda_orth:     0.5
  lambda_adv:     10.0
  grl_alpha:       5.0

  # 方向3
  lambda_modal_disc: 1.0
  grl_modal_alpha:   1.0

  # unused
  lambda_modal_cls:   0.0
  lambda_cross_modal: 0.0

  lr: 1.0e-3

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_B3/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_B3/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 100
seed: 43

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 20

output_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_B3/results"
