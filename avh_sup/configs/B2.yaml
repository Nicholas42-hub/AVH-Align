# ============================================================
#  Modal Balance B2 — Cross-Modal Alignment (方向2)
# ============================================================
#
#  Base: A2 (adversarial + stop-gradient on Z_s)
#
#  New constraint — 方向2 (use_cross_modal):
#    L_cross = mean(1 - cosine_similarity(v_c_t, a_c_t))  per frame
#    Forces v_c and a_c to encode the same semantic information.
#    Hypothesis: true causal info (AV authenticity) is shared across modalities;
#    aligning them steers both projectors away from modality-specific artifacts.
#
#  Hypothesis:
#    Alignment encourages both modalities to represent the same causal signal,
#    reducing the chance that one modality monopolises the causal branch.
#
# ============================================================

modal_balance_id: "B2"
modal_balance:
  use_modal_cls:   false  # 方向1: per-modality classification ✗
  use_cross_modal: true   # 方向2: cross-modal alignment       ✓
  use_modal_disc:  false  # 方向3: modal discriminator         ✗

data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: true

model_hparams:
  feat_dim:  1024
  proj_dim:  512

  # A2 base losses
  lambda_orth:     0.5
  lambda_adv:     10.0
  grl_alpha:       5.0

  # 方向2 (label-conditioned: only align real samples)
  lambda_cross_modal: 0.1

  # unused
  lambda_modal_cls:   0.0
  lambda_modal_disc:  0.0
  grl_modal_alpha:    1.0

  lr: 1.0e-3

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_B2/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_B2/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 100
seed: 43

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 20

output_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_B2/results"
