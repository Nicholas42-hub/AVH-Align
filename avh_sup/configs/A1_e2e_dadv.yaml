# ============================================================
#  A1_e2e_dadv — A1 + Domain Adversarial Loss, Full E2E
#
#  A1 architecture (Z_c + Z_s full head, label-adversarial GRL on Z_s)
#  + domain adversarial push-pull:
#      push: GRL on Z_c  → forces Z_c domain-invariant
#      pull: direct domain supervision on Z_s  → concentrates domain shortcuts in Z_s
#
#  Key differences from A1 frozen-encoder:
#    1. AV-HuBERT fully unfrozen (n_unfreeze_layers = -1)
#    2. use_domain = true  (domain adversarial on Z_s)
#    3. Training data: ALL available preprocessed AV1M clips (~63k)
#       from generate_e2e_csv.py — vastly more than the 8k NPZ subset
#    4. Domain signal: FAVC val-real clips (domain=1, no task labels)
#    5. Smaller LRs to avoid catastrophic forgetting
#    6. Mixed precision + gradient accumulation for memory efficiency
# ============================================================

ablation_id: "A1_e2e_dadv"
ablation:
  use_adv:    true    # label-adversarial GRL on Z_s
  use_sg:     false   # A1-style: full_head(Z_c + Z_s) for classification
  use_domain: true    # domain adversarial push-pull (GRL on Z_c, direct on Z_s)

data_paths:
  # Generated by:  python generate_e2e_csv.py
  e2e_train_csv:  "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/train_e2e_full.csv"
  e2e_val_csv:    "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/val_e2e_full.csv"
  # FAVC real clips used only as domain=1 signal (no task label)
  favc_raw_root:  "/scratch/punim2637/nnliang/favc_preprocessed"

model_hparams:
  # AV-HuBERT encoder (fully unfrozen)
  avhubert_ckpt:       "/data/projects/punim2637/nnliang/av_hubert/avhubert/self_large_vox_433h.pt"
  avhubert_root:       "/data/projects/punim2637/nnliang/av_hubert/avhubert"
  n_unfreeze_layers:   -1       # -1 = unfreeze ALL layers

  max_frames:  150              # cap clip length (frames @ 25fps = 6s)

  # Projection / head architecture (same as frozen A1)
  feat_dim:  1024
  proj_dim:  512

  # Loss weights
  lambda_orth:         0.5
  lambda_adv:         10.0      # label-adversarial weight
  lambda_domain:       3.0      # weight for Z_c push term (domain-adversarial)
  lambda_ddis:         1.0      # weight for Z_s pull term (domain-disentangle)
  grl_alpha:           5.0      # GRL scale for label adversarial
  grl_domain_alpha:    5.0      # max GRL scale for domain adversarial (Z_c push)
  dann_progressive:    true     # ramp grl_domain_alpha from 0 → max (DANN schedule)
  dann_gamma:          10.0     # DANN schedule steepness (higher = faster ramp)

  # Learning rates — encoder gets ~100x smaller LR than head
  lr_encoder:    1.0e-6         # very small for full fine-tune
  lr:            1.0e-4         # head LR
  weight_decay:  1.0e-4

# Training setup
batch_size:              8      # doubled — A100 80GB has headroom; halves steps/epoch
accumulate_grad_batches: 4      # effective batch size = 32 (unchanged)
num_workers:             6
favc_oversample:         10     # repeat FAVC 10× → ~5000 clips vs 60k AV1M
gradient_clip_val:       1.0    # prevent gradient explosion
precision:               "16-mixed"  # AMP for memory efficiency

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A1_e2e_dadv/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A1_e2e_dadv/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 30
seed: 43

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 10

output_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A1_e2e_dadv/results"
