# ============================================================
#  DAOF_v2_trainvalreal_seed44
#
#  DAOF v2 fixes:
#   - ct_dim=1024 (was 512): task head gets near-full 1280d capacity
#   - cs_dim=256  (was 512): domain shortcut is a small subspace
#   - lambda_ct_cs_orth=0.1 (was 0.5): less aggressive orthogonality
#   - lambda_cs_cond_dis=0.5 (was 1.0): less aggressive Z_cs extraction
# ============================================================

ablation_id: "DAOF_v2_trainvalreal_seed44"

data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: true

favc_domain_info:
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/favc_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/favc_npz_matched"
  split: "trainval"
  real_only: true
  apply_l2: true

model_hparams:
  feat_dim: 1024
  syn_dim: 256
  spec_dim: 256
  sda_dim: 128
  mi_dim: 128
  incon_dim: 256
  ct_dim: 1024       # was 512 — give task head near-full capacity
  cs_dim: 256        # was 512 — domain shortcut is a small subspace
  label_emb_dim: 32

  lambda_mi: 1.0
  lambda_sda: 0.5
  lambda_dis: 1.0
  lambda_orth_ur: 0.1
  lambda_ct_dadv: 1.0
  lambda_cs_cond_dis: 0.5    # was 1.0
  lambda_res_dis: 1.0
  lambda_ct_cs_orth: 0.1     # was 0.5
  grl_alpha: 1.0
  lambda_incon_sparse: 0.0

  sda_eps: 0.05
  sda_n_iter: 5
  lr: 1.0e-3

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_DAOF_v2_trainvalreal_seed44/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_DAOF_v2_trainvalreal_seed44/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 50
seed: 44

early_stopping:
  metric: "val_auc_causal"
  mode: "max"
  patience: 20
