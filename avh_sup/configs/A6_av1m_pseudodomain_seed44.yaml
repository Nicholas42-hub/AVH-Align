    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A6_av1m_pseudodomain_seed44/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 20
seed: 44

early_stopping:
  metric: "val_auc_causal"
  mode: "max"
  patience: 20
