# ============================================================
#  Ablation A3 — Three-way UDA — 50-epoch retrain, seed 45
#  Uses real FAVC val data for domain adversarial loss (UDA).
# ============================================================

ablation_id: "A3"
ablation:
  use_adv:    true
  use_sg:     true
  use_domain: true

data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: true

domain_data_info:
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/favc_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/favc"
  apply_l2: true

model_hparams:
  feat_dim:  1024
  proj_dim:  512

  lambda_orth:        0.5
  lambda_adv:        10.0
  lambda_domain:      5.0
  grl_alpha:          5.0
  grl_domain_alpha:   1.0
  lr: 1.0e-3

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A3_50ep_seed45/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A3_50ep_seed45/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 50
seed: 45

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 50
