# A28: A26 with lr_encoder raised from 2e-7 to 5e-6 (25x increase)
#
# A26 ep0 showed task AUC=0.9999 but z_sync RAW stayed flat at ~0.9988.
# Root cause: lr_encoder=2e-7 is too low — the encoder barely moves per epoch,
# so the domain mean gap doesn't close. A9_e2e itself used lr_encoder=5e-6
# and converged to task AUC=1.0. Since mean-align gradient is gentle (not
# adversarial) and task gradient is near-zero (confident predictions at start),
# raising lr_encoder to 5e-6 will shift domain means without task collapse.
#
# Everything else identical to A26:
#   - finetune from A9_e2e epoch-8 (task AUC=1.0)
#   - lambda_mean_align=10 (direct MSE on domain means)
#   - lambda_zsync_dann=2 (light residual covariance DANN)
#   - lambda_ddis=1.0, lambda_ladv=1.0, lambda_orth=0.1
#   - Dual probe: RAW (true) + CENTERED (residual)

ablation_id: A28_e2e
accumulate_grad_batches: 4
augmentation:
  audio_noise: 0.05
  brightness: 0.5
  enabled: true
  flip_p: 0.5
  p: 0.9
  video_noise: 0.3
batch_size: 8
callbacks:
  ckpt_args:
    ckpt_dir: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A28_e2e/ckpts
    metric: val_auc_causal
    mode: max
  logger:
    log_path: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A28_e2e/logs
    name: csv
data_paths:
  e2e_train_csv: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/train_e2e_full.csv
  e2e_val_csv: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/val_e2e_full.csv
  favc_raw_root: /scratch/punim2637/nnliang/favc_preprocessed
early_stopping:
  metric: val_auc_causal
  mode: max
  patience: 10
epochs: 30
favc_oversample: 3
gradient_clip_val: 1.0
model_hparams:
  app_dim: 256
  avhubert_ckpt: /data/projects/punim2637/nnliang/av_hubert/avhubert/self_large_vox_433h.pt
  avhubert_root: /data/projects/punim2637/nnliang/av_hubert/avhubert
  feat_dim: 1024
  finetune_ckpt: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A9_e2e/ckpts/model-epoch=08-val_auc_causal=1.0000.ckpt
  grl_alpha: 1.0
  grl_alpha_zsync: 1.0
  lambda_ddis: 1.0
  lambda_ladv: 1.0
  lambda_mean_align: 10.0
  lambda_orth: 0.1
  lambda_zsync_dann: 2.0
  lr: 0.0001
  lr_encoder: 5.0e-06
  max_frames: 150
  n_unfreeze_layers: -1
  sync_dim: 512
  weight_decay: 0.0001
num_workers: 6
output_path: /data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A28_e2e/results
precision: 16-mixed
seed: 43
