# ============================================================
#  A40_orth_e2e — A40 + orthogonality regularization
# ============================================================
#
#  Controlled comparison against A40:
#    identical pipeline, data, sampler, and loss weights
#    except for one added term:
#      + lambda_orth * L_orth
#
#  L_orth is applied on AV1M clips only, matching earlier AVH-Align e2e runs.
# ============================================================

ablation_id: "A40_orth_e2e"
ablation:
  use_adv:    false
  use_sg:     true
  use_domain: false

data_paths:
  e2e_train_csv: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/train_e2e_full.csv"
  e2e_val_csv:   "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/val_e2e_full.csv"
  favc_raw_root: "/scratch/punim2637/nnliang/favc_preprocessed"

model_hparams:
  avhubert_ckpt:     "/data/projects/punim2637/nnliang/av_hubert/avhubert/self_large_vox_433h.pt"
  avhubert_root:     "/data/projects/punim2637/nnliang/av_hubert/avhubert"
  n_unfreeze_layers: -1

  max_frames: 150
  feat_dim:   1024
  proj_dim:   512
  proj_dim_spurious: 512

  lambda_ipw:         0.0
  ipw_clip_min:       0.1
  ipw_clip_max:      10.0
  ipw_warmup_epochs:  0

  lambda_grl:         0.0
  grl_warmup_epochs:  0

  lambda_ladv_ds:     1.0
  lambda_mean_zc:     5.0
  lambda_orth:        0.1

  lr_encoder:      5.0e-6
  lr:              1.0e-4
  lr_domain_pred:  1.0e-4
  weight_decay:    1.0e-4

batch_size:              8
accumulate_grad_batches: 4
num_workers:             6
favc_oversample:         1
favc_real_only:          false
balanced_domain_sampler: true
gradient_clip_val:       1.0
precision:               "16-mixed"

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A40_orth_e2e/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A40_orth_e2e/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 30
seed: 43

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 10

output_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A40_orth_e2e/results"
