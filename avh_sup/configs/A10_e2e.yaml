# ============================================================
#  A10_e2e — SAD + MMD, Fully E2E, with Root-Cause Fixes
#
#  Fixes vs A9_e2e:
#
#  FIX 1 — Manipulation-distribution confound:
#    A9_e2e used FAVC real_only=True (500 real clips) as domain=1.
#    AV1M (domain=0) is mostly fake → MMD was aligning
#    "mostly-fake features" with "all-real features" which SHOULD
#    differ for good deepfake detection.  This constrained MMD from
#    learning recording-condition invariance.
#    → Use ALL FAVC clips (real+fake, ~21k, favc_real_only: false)
#      so both domains have matched manipulation distributions.
#
#  FIX 2 — Input-level recording-condition domain gap:
#    AV1M (YouTube) and FAVC differ at pixel/audio level
#    (codec quality, lighting, demographics).  The encoder faithfully
#    encodes these differences.
#    → Strong video/audio augmentation during training:
#        - Gaussian noise on video frames
#        - Random brightness shift
#        - Random horizontal flip
#        - Gaussian noise on audio features
#      Applied to BOTH domains equally so the encoder learns to
#      ignore low-level recording quality signals.
#
#  Architecture: same as A9_e2e (SAD + MMD, AV-HuBERT fully unfrozen).
# ============================================================

ablation_id: "A10_e2e"

data_paths:
  e2e_train_csv: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/train_e2e_full.csv"
  e2e_val_csv:   "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/val_e2e_full.csv"
  favc_raw_root: "/scratch/punim2637/nnliang/favc_preprocessed"

model_hparams:
  avhubert_ckpt:       "/data/projects/punim2637/nnliang/av_hubert/avhubert/self_large_vox_433h.pt"
  avhubert_root:       "/data/projects/punim2637/nnliang/av_hubert/avhubert"
  n_unfreeze_layers:   -1

  max_frames:  150
  feat_dim:   1024
  sync_dim:    512
  app_dim:     256

  # CORAL lambda: aligns mean+covariance of Z_sync — directly attacks
  # what a linear probe exploits (linear separability between domains).
  lambda_coral:  25.0
  lambda_ddis:   1.0
  lambda_ladv:   1.0
  lambda_orth:   0.1
  grl_alpha:     1.0
  mmd_min_samples: 2

  lr_encoder:    1.0e-6
  lr:            1.0e-4
  weight_decay:  1.0e-4

# ── Augmentation config ───────────────────────────────────────────────────────
# Applied to BOTH AV1M and FAVC in training (not at val/test time).
# Video frames are AV-HuBERT normalized float32 (range ~[-2.5, 2]).
# Audio feats are layer-normalized float32.
augmentation:
  enabled:      true
  p:            0.9        # probability of augmenting each clip
  video_noise:  0.3        # max σ of additive Gaussian noise on video
  brightness:   0.5        # max additive brightness shift (normalised space)
  flip_p:       0.5        # probability of horizontal flip per clip
  audio_noise:  0.05       # max σ of additive Gaussian noise on audio feats

# Training setup
batch_size:              8
accumulate_grad_batches: 4      # effective batch size = 32
num_workers:             6
# FIX 1: real_only=False → ~21k FAVC clips; oversample 3× → ~63k vs 60k AV1M
favc_oversample:         3
gradient_clip_val:       1.0
precision:               "16-mixed"

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A10_e2e/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A10_e2e/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 30
seed: 43

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 10

output_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A10_e2e/results"
