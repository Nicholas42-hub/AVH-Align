# ============================================================
#  DANN-UDA  α-sweep: grl_alpha = 10.0
#  Sensitivity analysis variant of DANN.yaml; only grl_alpha differs.
# ============================================================

data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: true

favc_domain_info:
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/favc_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/favc"
  split: "val"
  real_only: true
  apply_l2: true

model_hparams:
  feat_dim:    1024
  proj_dim:    512
  lambda_adv:  1.0
  grl_alpha:   10.0
  lr:          1.0e-3

batch_size: 1

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_DANN/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_DANN/ckpts"
    metric: "val_auc"
    mode: "max"

epochs: 20
seed: 43

early_stopping:
  metric:   "val_auc"
  mode:     "max"
  patience: 20
