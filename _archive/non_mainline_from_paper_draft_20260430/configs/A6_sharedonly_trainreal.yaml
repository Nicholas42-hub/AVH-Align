# ============================================================
#  A6-sharedonly-trainreal
#
#  Domain adversarial pressure restricted to shared subspace only.
#  Hypothesis: A6's real gain comes from u_v/u_a (unique channels).
#  Applying domain GRL to the full Z_c = [s_v, u_v, s_a, u_a]
#  contaminates exactly those channels. Fix: GRL only on [s_v, s_a].
#
#  Structural change vs A6:
#    domain_head_c input: cat([s_v, s_a]).mean(T)  [dim=512]  ← protected u_v/u_a
#    domain_head_s input: cat([r_v, r_a]).mean(T)  [dim=512]  ← unchanged
# ============================================================

ablation_id: "A6_sharedonly_trainreal"

data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: true

favc_domain_info:
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/favc_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/favc_npz_matched"
  split: "train"
  real_only: true
  apply_l2: true

model_hparams:
  feat_dim: 1024
  syn_dim: 256
  spec_dim: 256
  sda_dim: 128
  mi_dim: 128

  lambda_mi: 1.0
  lambda_sda: 0.5
  lambda_dis: 1.0
  lambda_orth: 0.1
  lambda_dadv: 1.0      # kept at 1.0, but now only applied to [s_v, s_a]
  lambda_ddis: 1.0
  grl_alpha: 1.0

  sda_eps: 0.05
  sda_n_iter: 5
  lr: 1.0e-3

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A6_sharedonly_trainreal/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A6_sharedonly_trainreal/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 100
seed: 43

early_stopping:
  metric: "val_auc_causal"
  mode: "max"
  patience: 20
