# ============================================================
#  A34_e2e — A33 (IPW) + Light GRL on Z_c (lambda=0.2)
# ============================================================
#
#  A33 achieved cross-domain AUC=0.803 (epoch 3) but domain probe Z_c=0.983.
#  A34 adds a light adversarial GRL on Z_c to nudge domain invariance
#  WITHOUT the large lambda (10-15) that destroyed task AUC in A20-A25.
#
#  Total loss:
#    L = L_task_ipw                   (IPW-reweighted CE, AV1M only)
#      + lambda_ipw  * L_domain_pred  (non-adversarial, for IPW weights)
#      + lambda_grl  * L_grl_zc       (adversarial GRL on Z_c, lambda=0.2)
#
#  Key design choices:
#    - lambda_grl = 0.2  (gentle nudge; A20-A25 used 10-15)
#    - GRL on mean-pooled Z_c only (not raw encoder features)
#    - Separate domain_predictor (detached) and domain_clf_grl (adversarial)
#    - Both IPW and GRL have 2-epoch warm-up
#    - lr_encoder = 5e-6 (same as A33)
# ============================================================

ablation_id: "A34_e2e"
ablation:
  use_adv:    false
  use_sg:     true
  use_domain: false

data_paths:
  e2e_train_csv:  "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/train_e2e_full.csv"
  e2e_val_csv:    "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/val_e2e_full.csv"
  favc_raw_root:  "/scratch/punim2637/nnliang/favc_preprocessed"

model_hparams:
  avhubert_ckpt:       "/data/projects/punim2637/nnliang/av_hubert/avhubert/self_large_vox_433h.pt"
  avhubert_root:       "/data/projects/punim2637/nnliang/av_hubert/avhubert"
  n_unfreeze_layers:   -1

  max_frames:  150
  feat_dim:  1024
  sync_dim:  512
  proj_dim:  512
  app_dim:   256

  # IPW parameters (same as A33)
  lambda_ipw:         1.0
  ipw_clip_min:       0.1
  ipw_clip_max:      10.0
  ipw_warmup_epochs:  2

  # GRL domain invariance (NEW vs A33)
  lambda_grl:         0.2       # light adversarial pressure on Z_c
  grl_warmup_epochs:  2         # start GRL after IPW has converged

  lr_encoder:    5.0e-6
  lr:            1.0e-4
  lr_domain_pred: 1.0e-4
  weight_decay:  1.0e-4

batch_size:              8
accumulate_grad_batches: 4
num_workers:             6
favc_oversample:         10
gradient_clip_val:       1.0
precision:               "16-mixed"

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A34_e2e/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A34_e2e/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 30
seed: 43

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 10

output_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A34_e2e/results"
