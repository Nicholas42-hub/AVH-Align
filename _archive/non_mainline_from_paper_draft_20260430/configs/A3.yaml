# ============================================================
#  Ablation A3 — Adversarial + Stop Gradient + Domain-Aware
# ============================================================
#
#  Component 1: GRL adversarial loss on Z_s                   ✓
#  Component 2: Classification restricted to Z_c only          ✓
#  Component 3: Domain adversarial on Z_s (AV1M vs FAVC)       ✓
#
#  Key idea: Mix AV1M (domain=0) + FAVC train (domain=1) during training.
#  GRL_domain forces Z_s to be domain-invariant → Z_c bears all
#  domain-specific shortcut → proper causal/spurious separation.
#
# ============================================================

ablation_id: "A3"
ablation:
  use_adv:    true    # Component 1: adversarial loss ✓
  use_sg:     true    # Component 2: stop-gradient    ✓
  use_domain: true    # Component 3: domain-aware     ✓

data_info:
  name: "AV1M"
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/avh_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"
  apply_l2: true

domain_data_info:
  root_path: "/data/projects/punim2637/nnliang/AVH-Align/data/favc_features"
  csv_root_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/favc"
  apply_l2: true

model_hparams:
  feat_dim:  1024
  proj_dim:  512

  lambda_orth:        0.5
  lambda_adv:        10.0
  lambda_domain:      5.0    # domain adversarial weight
  grl_alpha:          5.0
  grl_domain_alpha:   1.0
  lr: 1.0e-3

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A3/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A3/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 100
seed: 43

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 20
