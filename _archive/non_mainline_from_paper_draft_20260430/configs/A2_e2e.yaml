# ============================================================
#  End-to-end A2 — Adversarial + Stop-Gradient
#  AV-HuBERT top 4 layers fine-tuned jointly
# ============================================================

ablation_id: "A2_e2e"
ablation:
  use_adv:    true
  use_sg:     true
  use_domain: false

data_paths:
  av1m_raw_root:  "/data/scratch/projects/punim2637/nnliang/avd1m_preprocessed"
  favc_raw_root:  "/data/scratch/projects/punim2637/nnliang/favc_preprocessed"
  av1m_csv_root:  "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m"

model_hparams:
  # AV-HuBERT encoder
  avhubert_ckpt:       "/data/projects/punim2637/nnliang/av_hubert/avhubert/self_large_vox_433h.pt"
  avhubert_root:       "/data/projects/punim2637/nnliang/av_hubert/avhubert"
  n_unfreeze_layers:   4       # unfreeze top 4 transformer layers + layer-norm
  max_frames:          150     # cap clip length to save memory

  # Projection heads (same as frozen A2)
  feat_dim:  1024
  proj_dim:  512

  # Training objectives
  lambda_orth:    0.5
  lambda_adv:    10.0
  lambda_domain:  0.0
  grl_alpha:      5.0
  grl_domain_alpha: 1.0

  # Learning rates (encoder much smaller than head)
  lr_encoder:   1.0e-5
  lr:           1.0e-3
  weight_decay: 1.0e-4

batch_size:   16      # smaller than frozen because we run the full model
num_workers:  4

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A2_e2e/logs"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A2_e2e/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 50
seed: 42

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 15

output_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A2_e2e/results"
