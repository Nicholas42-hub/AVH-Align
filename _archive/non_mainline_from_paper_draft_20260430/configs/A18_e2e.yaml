# ============================================================
#  A18_e2e — Dual DANN at Encoder AND Z_sync level
#
#  A17: GRL at enc_feats [2048] only (encoder-level DANN)
#  A18: GRL at enc_feats [2048] + GRL at z_sync_pool [512]
#
#  Motivation:
#    Even if A17 makes enc_feats domain-agnostic, the SAD head could
#    re-encode residual domain info from enc_feats into z_sync.
#    A18 closes this gap by applying GRL *directly* at z_sync_pool,
#    the exact representation whose domain AUC we're targeting.
#
#  Monitor (should trend toward 0.5 as training progresses):
#    train_domain_acc_enc   → encoder domain accuracy
#    train_domain_acc_zsync → z_sync domain accuracy
# ============================================================

ablation_id: "A18_e2e"

data_paths:
  e2e_train_csv: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/train_e2e_full.csv"
  e2e_val_csv:   "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/val_e2e_full.csv"
  favc_raw_root: "/scratch/punim2637/nnliang/favc_preprocessed"

model_hparams:
  avhubert_ckpt:       "/data/projects/punim2637/nnliang/av_hubert/avhubert/self_large_vox_433h.pt"
  avhubert_root:       "/data/projects/punim2637/nnliang/av_hubert/avhubert"
  n_unfreeze_layers:   -1

  max_frames:  150
  feat_dim:   1024
  sync_dim:    512
  app_dim:     256

  # Level 1: Encoder-level DANN (same as A17)
  lambda_enc_coral: 0.0
  lambda_enc_dann:  1.0
  grl_alpha_enc:    1.0

  # Level 2: Z_sync-level DANN (A18 new)
  lambda_zsync_dann: 1.0
  grl_alpha_zsync:   1.0

  lambda_ddis:       1.0
  lambda_ladv:       1.0
  lambda_orth:       0.1
  grl_alpha:         1.0
  mmd_min_samples:   2

  lr_encoder:    5.0e-6   # same as A17: 20:1 ratio helps encoder keep up
  lr:            1.0e-4
  weight_decay:  1.0e-4

# ── Augmentation config ───────────────────────────────────────────────────────
augmentation:
  enabled:      true
  p:            0.9
  video_noise:  0.3
  brightness:   0.5
  flip_p:       0.5
  audio_noise:  0.05

# Training setup
batch_size:              8
accumulate_grad_batches: 4
num_workers:             6
favc_oversample:         3
gradient_clip_val:       1.0
precision:               "16-mixed"

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A18_e2e/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A18_e2e/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 30
seed: 43

early_stopping:
  metric:   "val_auc_causal"
  mode:     "max"
  patience: 10

output_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A18_e2e/results"
