# ============================================================
#  A45_e2e — Class-Conditional Disentanglement
# ============================================================
#
#  Main task:
#    identical to A41 family — causal classification on AV1M only
#
#  New auxiliary components:
#    1. true FAVC labels for auxiliary disentanglement losses
#    2. conditional GRL on Z_c
#    3. class-conditional center alignment on Z_c
#    4. label-aware domain pull on Z_s using effective labels
#    5. orthogonality on AV1M
# ============================================================

ablation_id: "A45_e2e"
ablation:
  use_adv: true
  use_sg: true
  use_domain: false

data_paths:
  e2e_train_csv: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/train_e2e_full.csv"
  e2e_val_csv: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/csv_metadata/av1m_e2e/val_e2e_full.csv"
  favc_raw_root: "/scratch/punim2637/nnliang/favc_preprocessed"

model_hparams:
  avhubert_ckpt: "/data/projects/punim2637/nnliang/av_hubert/avhubert/self_large_vox_433h.pt"
  avhubert_root: "/data/projects/punim2637/nnliang/av_hubert/avhubert"
  n_unfreeze_layers: -1

  max_frames: 150
  feat_dim: 1024
  proj_dim: 512
  proj_dim_spurious: 512

  lambda_adv: 3.0
  grl_alpha: 5.0
  adv_all_labeled: true

  lambda_ladv_ds: 1.0

  lambda_cond_grl: 0.5
  cond_grl_alpha: 1.0
  cond_grl_warmup_epochs: 2
  cond_grl_ramp_epochs: 4

  lambda_cond_align: 0.1
  lambda_orth: 0.1

  lr_encoder: 5.0e-6
  lr: 1.0e-4
  lr_domain_pred: 1.0e-4
  weight_decay: 1.0e-4

batch_size: 8
accumulate_grad_batches: 4
num_workers: 6
favc_oversample: 1
favc_real_only: false
balanced_domain_sampler: true
use_target_aux_labels: true
gradient_clip_val: 1.0
precision: "16-mixed"

callbacks:
  logger:
    log_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A45_e2e/logs"
    name: "csv"
  ckpt_args:
    ckpt_dir: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A45_e2e/ckpts"
    metric: "val_auc_causal"
    mode: "max"

epochs: 30
seed: 43

early_stopping:
  metric: "val_auc_causal"
  mode: "max"
  patience: 10

output_path: "/data/projects/punim2637/nnliang/AVH-Align/avh_sup/outputs_A45_e2e/results"
